<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c99a" />
      <stop offset="45%" stop-color="#e6a6a6" />
      <stop offset="100%" stop-color="#a9c6b0" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241d18" />
      <stop offset="100%" stop-color="#14110f" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#ground)" />

  <!-- Monogram N, drawn as strokes so it stays crisp at 16px. -->
  <path
    d="M20 46 V18 L44 46 V18"
    fill="none"
    stroke="url(#warm)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
